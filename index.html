<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="やることクエスト">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style>
<title>やることクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one column, big tap rows. Three tabs for the day (あさ / ほうかご / よる).
   The reward card under ほうかご stays locked until the required tasks above it are done and their timers have ended. */
:root{
  --bg:#EDF2FA;--surface:#FFFFFF;--surface-2:#E1E9F6;
  --ink:#14233B;--ink-soft:#4D5E7A;--line:#C9D5E8;
  --accent:#2457E6;--accent-ink:#FFFFFF;--on-accent-soft:rgba(255,255,255,.4);
  --gold:#FFB300;--gold-ink:#3A2600;--gold-bg:#FFF0C2;
  --ok:#12805A;--ok-ink:#FFFFFF;--done-bg:#E2F3EA;--focus:#2457E6;
  --font-display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1424;--surface:#152037;--surface-2:#1E2C48;
    --ink:#E8EEFA;--ink-soft:#A3B2CC;--line:#2B3C5C;
    --accent:#7EA6FF;--accent-ink:#0A1224;--on-accent-soft:rgba(10,18,36,.3);
    --gold:#FFC53D;--gold-ink:#2E1F00;--gold-bg:#3B2F12;
    --ok:#3DD598;--ok-ink:#07241A;--done-bg:#12302A;--focus:#7EA6FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1424;--surface:#152037;--surface-2:#1E2C48;
  --ink:#E8EEFA;--ink-soft:#A3B2CC;--line:#2B3C5C;
  --accent:#7EA6FF;--accent-ink:#0A1224;--on-accent-soft:rgba(10,18,36,.3);
  --gold:#FFC53D;--gold-ink:#2E1F00;--gold-bg:#3B2F12;
  --ok:#3DD598;--ok-ink:#07241A;--done-bg:#12302A;--focus:#7EA6FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:500;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}

.top{display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.date{margin:0;color:var(--ink-soft);font-size:14px;font-weight:700;letter-spacing:.06em}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.15;text-wrap:balance}
.pts{display:flex;align-items:baseline;gap:4px;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:14px;font-variant-numeric:tabular-nums;flex:none}
.pts-n{font-family:var(--font-display);font-size:28px;line-height:1.2}
.pts-u{font-size:14px;font-weight:900}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.goal-text{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:700;flex-wrap:wrap}
.goal-text .g-main{min-width:0;overflow-wrap:anywhere}
.streak{color:var(--ink-soft);font-weight:900;white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.pill{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:900}
.pill .clock{font-size:18px}

.banner{background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:900;font-size:17px}
.banner span{min-width:0;overflow-wrap:anywhere}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 6px 10px;font-weight:900;font-size:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;min-height:64px}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.segs{display:flex;gap:3px;width:100%;padding-inline:6px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--ok)}
.tab[aria-selected="true"] .segs i{background:var(--on-accent-soft)}
.tab[aria-selected="true"] .segs i.on{background:var(--accent-ink)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.task.done{background:var(--done-bg);border-color:transparent}
.task-main{appearance:none;border:0;background:transparent;color:inherit;width:100%;display:flex;align-items:center;gap:14px;padding:14px;text-align:left;cursor:pointer;min-height:68px}
.task-main.static{cursor:default}
.step{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;font-family:var(--font-display);color:var(--accent);font-size:18px}
.task.done .step{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.task.just .step{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.label{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:19px;font-weight:900;overflow-wrap:anywhere}
.sub{font-size:13px;font-weight:700;color:var(--ink-soft)}
.task.next{border-color:var(--accent)}
.task.next .sub{color:var(--accent);font-weight:900}
.task.done .label{color:var(--ink-soft)}
.task.done .name{text-decoration:line-through;text-decoration-thickness:2px}
.gain{flex:none;font-size:13px;font-weight:900;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.timer-row{display:flex;align-items:center;gap:12px;padding:0 14px 14px 68px;flex-wrap:wrap}
.clock{font-family:var(--font-display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.hint{margin:0;text-align:center;color:var(--ink-soft);font-size:13px;font-weight:700}
.items{list-style:none;margin:0;padding:0 14px 14px 68px;display:flex;flex-direction:column;gap:8px}
.item{appearance:none;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:48px;font-weight:700;font-size:17px;text-align:left;cursor:pointer}
.item.on{border-color:var(--ok);background:var(--done-bg);color:var(--ink-soft)}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-soft);display:grid;place-items:center}
.item.on .box{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}

.btn{appearance:none;border:0;border-radius:12px;font-weight:900;font-size:15px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn:focus-visible,.tab:focus-visible,.task-main:focus-visible,.item:focus-visible,.link-btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.reward{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;border:2px dashed var(--line);background:var(--surface-2);color:var(--ink-soft)}
.reward.open{border:2px solid var(--gold);background:var(--gold-bg);color:var(--ink)}
.reward h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px;display:flex;gap:10px;align-items:center;line-height:1.25}
.reward h2 svg{flex:none}
.reward p{margin:0;font-weight:700}
.reward .clock{color:var(--ink);font-size:44px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:16px}
.panel h2{margin:0;font-size:18px}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--ink-soft)}
.note{margin:0;color:var(--ink-soft);font-size:14px}
.group{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea{resize:vertical;font-size:13px;line-height:1.4;word-break:break-all}
.field textarea{width:100%}
.warn{background:var(--gold-bg);color:var(--ink);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}
input[type=text],input[type=number],input[type=time],textarea{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;min-width:0}
.row input[type=text]{flex:1 1 150px}
.row input[type=number]{width:72px;flex:none}
.chk{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;white-space:nowrap;min-height:44px}
.chk input{width:22px;height:22px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.field input{width:100%}
.danger{display:flex;gap:8px;flex-wrap:wrap}

.foot{display:flex;justify-content:center}
.link-btn{appearance:none;background:none;border:0;color:var(--ink-soft);font-weight:700;font-size:14px;text-decoration:underline;padding:10px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:900;max-width:calc(100% - 32px);text-align:center;z-index:10}
@media (prefers-reduced-motion: reduce){.task.just .step{animation:none}.bar>i{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header id="top" class="top"></header>
  <div id="banner" class="banner" role="status" hidden></div>
  <main id="main"></main>
  <footer class="foot"><button class="link-btn" id="gear" type="button" data-act="gear">おうちの人 せってい</button></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var KEY='yaru-quest-v1';
var BLOCKS=['morning','after','night'];
var NAMES={morning:'あさ',after:'ほうかご',night:'よる'};
var BAG=['ハンカチ','ティッシュペーパー','マスク','水筒','レッスンバッグ'];

function defaults(){
  return {
    tasks:{
      morning:[{id:'m1',label:'もちものチェック',items:BAG.slice()}],
      after:[{id:'a1',label:'てあらい・ランドセルをおく'},{id:'a2',label:'おやつ',min:15},{id:'a3',label:'宿題',min:30,confirm:true},{id:'a4',label:'つくえ・おもちゃのかたづけ',late:true}],
      night:[{id:'n1',label:'つくえ・おもちゃのかたづけ'},{id:'n2',label:'明日のじゅんび'},{id:'n3',label:'夜のおせわ'},{id:'n4',label:'はみがき'}]
    },
    settings:{rewardMin:60,goalPts:180,goalLabel:'ごほうびをえらべる',alarm:'18:00'},
    days:{},spent:0,timer:null,seq:100,ver:5,since:keyOf(new Date())
  };
}
function load(){
  var d=defaults();
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var o=JSON.parse(r);
      if(o&&typeof o==='object'){
        if(o.tasks){BLOCKS.forEach(function(b){if(Array.isArray(o.tasks[b]))d.tasks[b]=o.tasks[b];});}
        if(o.settings)Object.assign(d.settings,o.settings);
        if(o.days&&typeof o.days==='object')d.days=o.days;
        if(typeof o.spent==='number')d.spent=o.spent;
        if(typeof o.seq==='number')d.seq=o.seq;
        if(typeof o.since==='string')d.since=o.since;
        if(o.timer&&typeof o.timer.endsAt==='number'&&o.timer.endsAt>Date.now())d.timer=o.timer;
        if(typeof o.ver!=='number'||o.ver<2){
          var al=d.tasks.after,has=false,at=-1;
          al.forEach(function(t,i){if(t.id==='a4')has=true;if(t.id==='a3')at=i;});
          if(!has)al.splice(at>=0?at+1:al.length,0,{id:'a4',label:'つくえ・おもちゃのかたづけ'});
        }
        if(typeof o.ver!=='number'||o.ver<3){
          d.tasks.morning=defaults().tasks.morning;
          d.tasks.after.forEach(function(t){if(t.id==='a4')t.late=true;});
        }
        if(typeof o.ver!=='number'||o.ver<4){
          d.tasks.after.forEach(function(t){if(t.id==='a3'&&t.confirm===undefined)t.confirm=true;});
        }
        if(typeof o.ver!=='number'||o.ver<5){
          if(d.settings.goalPts===30)d.settings.goalPts=180;
        }
      }
    }
  }catch(e){}
  d.ver=5;
  return d;
}
var S=load();
var storageOk=(function(){
  try{localStorage.setItem('yq-test','1');var r=localStorage.getItem('yq-test')==='1';localStorage.removeItem('yq-test');return r;}
  catch(e){return false;}
})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;}}

/* settings code: copy the tasks and settings to another browser, or restore them */
function makeCode(){
  try{return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,tasks:S.tasks,settings:S.settings}))));}
  catch(e){return '';}
}
function applyCode(code){
  try{
    var o=JSON.parse(decodeURIComponent(escape(atob(String(code).replace(/\s+/g,'')))));
    if(!o||o.v!==1||!o.tasks)return false;
    var nt={},seen={},maxSeq=S.seq;
    BLOCKS.forEach(function(b){
      var arr=o.tasks[b];
      if(!Array.isArray(arr)||arr.length>30)throw new Error('tasks');
      nt[b]=arr.map(function(t){
        if(!t||typeof t.id!=='string'||!/^[A-Za-z0-9_-]{1,20}$/.test(t.id)||seen[t.id]||typeof t.label!=='string')throw new Error('task');
        seen[t.id]=true;
        var x={id:t.id,label:t.label.slice(0,60)||'やること'};
        var n=/^t(\d+)$/.exec(t.id);if(n)maxSeq=Math.max(maxSeq,parseInt(n[1],10));
        if(t.min>0)x.min=Math.min(180,Math.floor(t.min));
        if(t.confirm)x.confirm=true;
        if(t.late)x.late=true;
        if(Array.isArray(t.items)&&t.items.length){x.items=t.items.slice(0,20).map(function(s){return String(s).slice(0,40);});}
        return x;
      });
    });
    var st=o.settings||{};
    S.tasks=nt;S.seq=maxSeq;
    if(st.rewardMin>0)S.settings.rewardMin=Math.min(240,Math.floor(st.rewardMin));
    if(st.goalPts>0)S.settings.goalPts=Math.min(999,Math.floor(st.goalPts));
    if(typeof st.goalLabel==='string'&&st.goalLabel.trim())S.settings.goalLabel=st.goalLabel.trim().slice(0,60);
    if(typeof st.alarm==='string'&&(st.alarm===''||/^\d{1,2}:\d{2}$/.test(st.alarm)))S.settings.alarm=st.alarm;
    save();
    return true;
  }catch(e){return false;}
}

function pickTab(){var h=new Date().getHours();return h<10?'morning':(h<18?'after':'night');}
var ui={tab:pickTab(),settings:false,confirm:null,banner:null,just:null,next:null};

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return n<10?'0'+n:''+n;}
function keyOf(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function today(){var k=keyOf(new Date());if(!S.days[k])S.days[k]={done:{},pts:0,full:false};return S.days[k];}
function fmt(sec){return pad(Math.floor(sec/60))+':'+pad(sec%60);}
function remaining(){return S.timer?Math.max(0,Math.ceil((S.timer.endsAt-Date.now())/1000)):0;}
function timeLabel(a){var m=/^(\d{1,2}):(\d{2})$/.exec(a||'');return m?(+m[1])+'時'+(m[2]==='00'?'':(+m[2])+'分'):'';}

function blockOf(id){for(var i=0;i<BLOCKS.length;i++){var l=S.tasks[BLOCKS[i]];for(var j=0;j<l.length;j++){if(l[j].id===id)return BLOCKS[i];}}return null;}
function taskById(id){var b=blockOf(id);if(!b)return null;return S.tasks[b].filter(function(t){return t.id===id;})[0];}
function isConfirm(t){return !!(t&&t.confirm&&t.min);}
function stat(b,day){var l=S.tasks[b],n=0;l.forEach(function(t){if(day.done[t.id])n++;});return {n:n,total:l.length};}
function gateStat(day){var l=S.tasks.after.filter(function(t){return !t.late;}),n=0;l.forEach(function(t){if(day.done[t.id])n++;});return {n:n,total:l.length};}
function syncItems(day,t){
  var m=(day.sub&&day.sub[t.id])||{};
  var all=t.items.length>0&&t.items.every(function(x){return !!m[x];});
  if(all)day.done[t.id]=true;else delete day.done[t.id];
}
function recompute(day){
  var pts=0,full=true;
  BLOCKS.forEach(function(b){
    var s=stat(b,day);pts+=s.n;
    if(s.total>0&&s.n===s.total)pts+=3;
    if(s.n!==s.total)full=false;
  });
  day.pts=pts;day.full=full;
}
function total(){var s=0;for(var k in S.days)s+=S.days[k].pts||0;return Math.max(0,s-S.spent);}
function streak(){
  var d=new Date(),c=0;
  for(var i=0;i<400;i++){
    var r=S.days[keyOf(d)];
    if(r&&r.full){c++;}else if(i>0){break;}
    d.setDate(d.getDate()-1);
  }
  return c;
}

/* audio, wake lock, toast */
var actx=null;
function ensureAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){
  try{
    if(!actx)return;
    [0,0.3,0.6].forEach(function(d){
      var o=actx.createOscillator(),g=actx.createGain();
      o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(actx.destination);
      o.start(actx.currentTime+d);o.stop(actx.currentTime+d+0.18);
    });
  }catch(e){}
}
document.addEventListener('pointerdown',ensureAudio,{passive:true});
var wl=null;
function wake(){try{if(navigator.wakeLock&&navigator.wakeLock.request){navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}}catch(e){}}
function releaseWake(){try{if(wl){wl.release();wl=null;}}catch(e){}}
var tt=null;
function toast(m){var el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true;},2600);}

/* timers */
function startTimer(type,id,min,quiet){ensureAudio();wake();ui.banner=null;S.timer={type:type,id:id||null,endsAt:Date.now()+min*60000,total:min*60};save();if(!quiet)render();}
function stopTimer(){S.timer=null;releaseWake();save();}
function afterTimerRunning(){return !!(S.timer&&S.timer.type==='task'&&blockOf(S.timer.id)==='after');}
function rewardOpen(day){var g=gateStat(day);return g.n===g.total&&!afterTimerRunning();}
function finishTimer(){
  var t=S.timer,msg;
  S.timer=null;releaseWake();save();beep();
  if(t.type==='reward'){
    msg='ごほうびタイム おしまい！ スイッチも動画も オフにしよう';
  }else{
    var b=blockOf(t.id),day=today(),next=null;
    if(b){S.tasks[b].forEach(function(x){if(!next&&x.id!==t.id&&!day.done[x.id]&&!(b==='after'&&x.late))next=x;});}
    var cur=taskById(t.id);
    msg=(cur?cur.label:'タイマー')+'の じかん おわり！';
    if(cur&&isConfirm(cur)&&!day.done[cur.id]){msg+=' おわったら「おわった！」ボタンを おしてね';ui.next=cur.id;if(b)ui.tab=b;}
    else if(next){msg+=' つぎは「'+next.label+'」を はじめよう';ui.next=next.id;if(b)ui.tab=b;}
    else if(b==='after'&&rewardOpen(day)){msg+=' ごほうびタイムが ひらいたよ';ui.tab=b;}
  }
  ui.banner=msg;render();
}

/* daily alarm: guides to the "late" task (cleanup) once the set time has come */
function alarmTarget(day){var l=S.tasks.after;for(var i=0;i<l.length;i++){if(l[i].late&&!day.done[l[i].id])return l[i];}return null;}
function fireAlarm(day,test){
  var t=alarmTarget(day);
  if(!t){
    if(test){ui.banner='アラームのテスト：時間になると、ここに おしらせが でます';beep();render();}
    return;
  }
  var running=S.timer&&S.timer.type==='reward';
  ui.banner=(timeLabel(S.settings.alarm)?timeLabel(S.settings.alarm)+'だよ！ ':'')+(running?'ごほうびタイムを おわって、':'')+'つぎは「'+t.label+'」';
  ui.tab='after';ui.next=t.id;
  if(!test)ui.settings=false;
  beep();render();
}
function checkAlarm(){
  var m=/^(\d{1,2}):(\d{2})$/.exec(S.settings.alarm||'');
  if(!m)return;
  var now=new Date(),mins=now.getHours()*60+now.getMinutes(),target=(+m[1])*60+(+m[2]);
  if(mins<target||mins>=target+90)return;
  var day=today();
  if(day.alarmed)return;
  day.alarmed=true;save();
  fireAlarm(day,false);
}
setInterval(function(){
  checkAlarm();
  if(!S.timer)return;
  var rem=remaining();
  if(rem<=0){finishTimer();return;}
  var els=document.querySelectorAll('[data-clock]');
  for(var i=0;i<els.length;i++)els[i].textContent=fmt(rem);
},500);

/* rendering */
var ICON_CHECK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var ICON_CHECK_SM=ICON_CHECK.replace('width="22" height="22"','width="16" height="16"');
var ICON_LOCK='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
var ICON_OPEN='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>';

function renderTop(){
  var p=total(),g=Math.max(1,S.settings.goalPts||1),pct=Math.min(100,Math.round(p/g*100)),reached=p>=g;
  var dt=new Date(),w='日月火水木金土'.charAt(dt.getDay()),st=streak();
  var h='<div class="top-row"><div><p class="date">'+(dt.getMonth()+1)+'月'+dt.getDate()+'日（'+w+'）</p><h1>やることクエスト</h1></div>'+
    '<div class="pts" aria-label="ポイント"><span class="pts-n">'+p+'</span><span class="pts-u">pt</span></div></div>';
  h+='<div class="goal"><div class="goal-text"><span class="g-main">'+
    (reached?'ごほうびゲット！ '+esc(S.settings.goalLabel):'あと '+(g-p)+'pt で '+esc(S.settings.goalLabel))+
    '</span>'+(reached?'<button class="btn gold" type="button" data-act="claim">もらった</button>':
    '<span class="streak">'+(st>0?'れんぞく '+st+'日':'きょうから スタート')+'</span>')+
    '</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+g+'" aria-valuenow="'+Math.min(p,g)+'"><i style="width:'+pct+'%"></i></div></div>';
  if(S.timer){
    var cur=S.timer.type==='reward'?'ごほうびタイム':(taskById(S.timer.id)?taskById(S.timer.id).label:'タイマー');
    h+='<div class="pill"><span>'+esc(cur)+'</span><span class="clock" data-clock>'+fmt(remaining())+'</span></div>';
  }
  $('top').innerHTML=h;
}
function renderBanner(){
  var el=$('banner');
  if(ui.banner){el.hidden=false;el.innerHTML='<span>'+esc(ui.banner)+'</span><button class="btn gold" type="button" data-act="dismiss">OK</button>';}
  else{el.hidden=true;el.innerHTML='';}
}
function taskHtml(t,i,day){
  var done=!!day.done[t.id];
  if(t.items){
    var m=(day.sub&&day.sub[t.id])||{},cnt=0;
    t.items.forEach(function(x){if(m[x])cnt++;});
    var hi='<li class="task'+(done?' done':'')+'">'+
      '<div class="task-main static"><span class="step">'+(done?ICON_CHECK:(i+1))+'</span>'+
      '<span class="label"><span class="name">'+esc(t.label)+'</span><span class="sub">'+cnt+'/'+t.items.length+'　ぜんぶ チェックで +1pt</span></span><span class="gain">+1</span></div>'+
      '<ul class="items">';
    t.items.forEach(function(x,k){
      var on=!!m[x];
      hi+='<li><button class="item'+(on?' on':'')+'" type="button" data-act="item" data-id="'+t.id+'" data-i="'+k+'" aria-pressed="'+on+'"><span class="box">'+(on?ICON_CHECK_SM:'')+'</span>'+esc(x)+'</button></li>';
    });
    return hi+'</ul></li>';
  }
  var running=!!(S.timer&&S.timer.type==='task'&&S.timer.id===t.id);
  var inProg=isConfirm(t)&&!done&&!!(day.started&&day.started[t.id]);
  var isNext=ui.next===t.id&&!done;
  var sub='';
  if(inProg)sub=running?'タイマーちゅう':'じかん おわり！ おわったら ボタンを おしてね';
  else if(running)sub='タイマーちゅう';
  else if(!done&&t.min)sub=(isNext?'つぎは これ！ ':'')+'タップで '+t.min+'分タイマー スタート'+(isConfirm(t)?'（おわったら ボタン）':'');
  else if(!done&&t.late)sub=(isNext?'つぎは これ！ ':'')+'ごほうびタイムのあと'+(timeLabel(S.settings.alarm)?'（'+timeLabel(S.settings.alarm)+'におしらせ）':'');
  else if(isNext)sub='つぎは これ！';
  var inner='<span class="step">'+(done?ICON_CHECK:(i+1))+'</span>'+
    '<span class="label"><span class="name">'+esc(t.label)+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</span><span class="gain">+1</span>';
  var h='<li class="task'+(done?' done':'')+(isNext?' next':'')+(ui.just===t.id?' just':'')+'">'+
    (inProg?'<div class="task-main static">'+inner+'</div>':
      '<button class="task-main" type="button" data-act="toggle" data-id="'+t.id+'" aria-pressed="'+done+'">'+inner+'</button>');
  if(running||inProg){
    h+='<div class="timer-row">'+(running?'<span class="clock" data-clock>'+fmt(remaining())+'</span>':'')+
      (inProg?'<button class="btn" type="button" data-act="finish" data-id="'+t.id+'">おわった！</button><button class="btn ghost" type="button" data-act="cancel" data-id="'+t.id+'">とりけし</button>':'')+'</div>';
  }
  return h+'</li>';
}
function rewardHtml(day){
  var g=gateStat(day),open=rewardOpen(day),left=g.total-g.n,running=S.timer&&S.timer.type==='reward';
  if(running){
    return '<section class="reward open"><h2>'+ICON_OPEN+'ごほうびタイム</h2><span class="clock" data-clock>'+fmt(remaining())+'</span><button class="btn ghost" type="button" data-act="rstop">おわる</button></section>';
  }
  if(open){
    return '<section class="reward open"><h2>'+ICON_OPEN+'ごほうびタイム かいほう！</h2><p>スイッチ・動画 '+S.settings.rewardMin+'分</p><button class="btn gold" type="button" data-act="rstart">スタート</button></section>';
  }
  return '<section class="reward"><h2>'+ICON_LOCK+'ごほうびタイム ロックちゅう</h2><p>'+(left===0?'タイマーが おわると ひらくよ。もうすこし！':'ミッションをあと '+left+'こ おわらせると ひらくよ。')+'</p></section>';
}
function mainHtml(){
  var day=today(),h=(storageOk?'':'<div class="warn">この画面では きろくが ほぞんされません。プライベートブラウズを やめるか、べつの ブラウザで ひらいてください。</div>')+'<div class="tabs" role="tablist">';
  BLOCKS.forEach(function(b){
    var s=stat(b,day),segs='';
    for(var i=0;i<s.total;i++)segs+='<i'+(i<s.n?' class="on"':'')+'></i>';
    h+='<button class="tab" type="button" role="tab" aria-selected="'+(ui.tab===b)+'" data-tab="'+b+'"><span>'+NAMES[b]+' '+s.n+'/'+s.total+'</span><span class="segs">'+segs+'</span></button>';
  });
  h+='</div><div role="tabpanel" style="display:flex;flex-direction:column;gap:16px">';
  if(ui.tab==='after'){
    var ts=S.tasks.after,pre=ts.filter(function(t){return !t.late;}),post=ts.filter(function(t){return t.late;});
    h+='<ul class="list">';
    pre.forEach(function(t,i){h+=taskHtml(t,i,day);});
    h+='</ul>'+rewardHtml(day);
    if(post.length){
      h+='<ul class="list">';
      post.forEach(function(t,i){h+=taskHtml(t,pre.length+i,day);});
      h+='</ul>';
    }
  }else{
    h+='<ul class="list">';
    S.tasks[ui.tab].forEach(function(t,i){h+=taskHtml(t,i,day);});
    h+='</ul>';
  }
  if(S.tasks[ui.tab].length>1)h+='<p class="hint">ぜんぶ おわると ボーナス +3pt</p>';
  return h+'</div>';
}
function settingsHtml(){
  var h='<section class="panel"><h2>おうちの人 せってい</h2><p class="note">右の数字はタイマーの分数です。数字があるやることは、タップすると +1pt とタイマーが同時にスタートします。「おわったボタン」にチェックを入れると、タップでタイマーだけスタートし、「おわった！」ボタンを押したときに +1pt になります（宿題向け）。「ほうかご」の「あと」にチェックを入れたやることは、ごほうびタイムの条件に入らず、アラームの時間にお知らせします。ごほうびタイムは、条件のやることが全部終わり、タイマーも終わると開きます。</p>';
  BLOCKS.forEach(function(b){
    h+='<div class="group"><h3>'+NAMES[b]+'</h3>';
    S.tasks[b].forEach(function(t){
      h+='<div class="row"><input type="text" id="lbl-'+t.id+'" value="'+esc(t.label)+'" data-f="label" data-id="'+t.id+'" aria-label="やること">';
      if(!t.items)h+='<input type="number" id="min-'+t.id+'" min="0" max="180" inputmode="numeric" value="'+(t.min||'')+'" data-f="min" data-id="'+t.id+'" aria-label="タイマー（分）" placeholder="分">';
      if(!t.items)h+='<label class="chk"><input type="checkbox" id="conf-'+t.id+'" data-f="confirm" data-id="'+t.id+'"'+(t.confirm?' checked':'')+'>おわったボタン</label>';
      if(b==='after')h+='<label class="chk"><input type="checkbox" id="late-'+t.id+'" data-f="late" data-id="'+t.id+'"'+(t.late?' checked':'')+'>あと</label>';
      h+='<button class="btn ghost" type="button" data-act="del" data-id="'+t.id+'">けす</button></div>';
      if(t.items){
        h+='<div class="field"><label for="items-'+t.id+'">もちもの（「、」でくぎる）</label><input type="text" id="items-'+t.id+'" value="'+esc(t.items.join('、'))+'" data-f="items" data-id="'+t.id+'"></div>';
      }
    });
    h+='<div><button class="btn ghost" type="button" data-act="add" data-b="'+b+'">＋ ついか</button></div></div>';
  });
  h+='<div class="group"><h3>ごほうび</h3>'+
    '<div class="field"><label for="f-rm">ごほうびタイムの長さ（分）</label><input type="number" id="f-rm" min="1" max="240" inputmode="numeric" value="'+S.settings.rewardMin+'" data-f="rewardMin"></div>'+
    '<div class="field"><label for="f-gp">ごほうびまでのポイント</label><input type="number" id="f-gp" min="1" max="999" inputmode="numeric" value="'+S.settings.goalPts+'" data-f="goalPts"></div>'+
    '<div class="field"><label for="f-gl">ごほうびの内容</label><input type="text" id="f-gl" value="'+esc(S.settings.goalLabel)+'" data-f="goalLabel"></div></div>';
  h+='<div class="group"><h3>かたづけのお知らせ</h3>'+
    '<div class="field"><label for="f-al">お知らせの時間（空にするとなし）</label><input type="time" id="f-al" value="'+esc(S.settings.alarm||'')+'" data-f="alarm"></div>'+
    '<p class="note">この画面を開いているときだけ鳴ります。閉じていても鳴らしたいときは、iPhoneの「時計」アラームも使ってください。</p>'+
    '<div><button class="btn ghost" type="button" data-act="alarm-test">お知らせをためす</button></div></div>';
  var sn=/^(\d{4})-(\d{2})-(\d{2})$/.exec(S.since||'');
  h+='<div class="group"><h3>ほぞんの じょうたい</h3>'+
    '<p class="note">'+(storageOk?'このブラウザに保存できています。':'このブラウザには保存できていません。プライベートブラウズでないか確認してください。')+
    (sn?'この画面の記録は '+(+sn[2])+'月'+(+sn[3])+'日から続いています。閉じたあとに、この日付が今日に変わっていたら、ブラウザが記録を消しています。':'')+'</p></div>';
  h+='<div class="group"><h3>せっていコード（バックアップ・ほかの端末へ）</h3>'+
    '<p class="note">今の やること・時間・ごほうびの設定を、コードにしたものです。コピーして保管しておくと、消えたときに貼りつけて元に戻せます。ほかの端末にも同じ設定を入れられます。ポイントや記録は入りません。</p>'+
    '<div class="field"><label for="f-code">いまの設定コード</label><textarea id="f-code" rows="3" readonly>'+esc(makeCode())+'</textarea></div>'+
    '<div><button class="btn ghost" type="button" data-act="code-copy">コピー</button></div>'+
    '<div class="field"><label for="f-import">設定コードを貼りつける</label><textarea id="f-import" rows="3" placeholder="ここに貼りつけ"></textarea></div>'+
    '<div><button class="btn ghost" type="button" data-act="code-import">よみこむ</button></div></div>';
  h+='<div class="group"><h3>リセット</h3><div class="danger">'+
    '<button class="btn ghost" type="button" data-act="reset-today">'+(ui.confirm==='today'?'もう一度おすとリセット':'きょうのチェックを消す')+'</button>'+
    '<button class="btn ghost" type="button" data-act="reset-all">'+(ui.confirm==='all'?'もう一度おすと全部消える':'記録とポイントを全部消す')+'</button></div></div>'+
    '<button class="btn" type="button" data-act="gear">できた</button></section>';
  return h;
}
function render(){
  renderTop();renderBanner();
  $('main').innerHTML=ui.settings?settingsHtml():mainHtml();
  $('gear').textContent=ui.settings?'もどる':'おうちの人 せってい';
}

/* events */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-tab]');
  if(!el)return;
  if(el.getAttribute('data-tab')){ui.tab=el.getAttribute('data-tab');render();return;}
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act!=='reset-today'&&act!=='reset-all')ui.confirm=null;
  if(act==='toggle'||act==='finish'||act==='cancel'){
    var day=today(),b=blockOf(id),t=taskById(id);if(!b||!t)return;
    var before=stat(b,day),was=before.total>0&&before.n===before.total;
    var started=false,startedOnly=false;
    var timerHere=!!(S.timer&&S.timer.type==='task'&&S.timer.id===id);
    day.started=day.started||{};
    ui.next=null;ui.banner=null;
    if(act==='cancel'){
      delete day.started[id];
      if(timerHere)stopTimer();
      save();render();return;
    }
    if(act==='finish'&&day.done[id])return;
    if(day.done[id]){
      delete day.done[id];delete day.started[id];
      if(timerHere)stopTimer();
    }else if(isConfirm(t)&&act==='toggle'){
      day.started[id]=true;
      startTimer('task',id,t.min,true);startedOnly=true;
    }else{
      day.done[id]=true;delete day.started[id];
      if(isConfirm(t)){if(timerHere)stopTimer();}
      else if(t.min){startTimer('task',id,t.min,true);started=true;}
    }
    var wasFull=day.full;
    recompute(day);
    var after=stat(b,day),nowDone=after.n===after.total;
    save();ui.just=day.done[id]?id:null;render();ui.just=null;
    if(startedOnly)toast('タイマー '+t.min+'分 スタート！ おわったら ボタンを おしてね');
    else if(!wasFull&&day.full)toast('きょうは ぜんぶ クリア！');
    else if(started)toast('タイマー '+t.min+'分 スタート！ +1pt');
    else if(!was&&nowDone&&day.done[id])toast(NAMES[b]+'のミッション クリア！ +3pt'+(b==='after'&&rewardOpen(day)?'  ごほうびタイム かいほう！':''));
    else if(day.done[id])toast('+1pt');
  }
  else if(act==='item'){
    var iday=today(),ib=blockOf(id),it=taskById(id);if(!ib||!it||!it.items)return;
    var iname=it.items[parseInt(el.getAttribute('data-i'),10)];if(iname===undefined)return;
    var iwasDone=!!iday.done[id],iwasFull=iday.full,isb=stat(ib,iday),iwas=isb.total>0&&isb.n===isb.total;
    ui.next=null;
    iday.sub=iday.sub||{};
    var im=iday.sub[id]=iday.sub[id]||{};
    if(im[iname])delete im[iname];else im[iname]=true;
    syncItems(iday,it);recompute(iday);
    var isa=stat(ib,iday),inowDone=isa.n===isa.total;
    save();render();
    if(!iwasFull&&iday.full)toast('きょうは ぜんぶ クリア！');
    else if(!iwas&&inowDone&&iday.done[id])toast(NAMES[ib]+'のミッション クリア！ +3pt');
    else if(!iwasDone&&iday.done[id])toast('もちもの ぜんぶOK！ +1pt');
  }
  else if(act==='rstop'){stopTimer();render();}
  else if(act==='rstart'){startTimer('reward',null,S.settings.rewardMin||60);}
  else if(act==='dismiss'){ui.banner=null;render();}
  else if(act==='claim'){S.spent+=Math.max(1,S.settings.goalPts||1);save();render();toast('ごほうび ゲット！');}
  else if(act==='gear'){ui.settings=!ui.settings;ui.confirm=null;render();window.scrollTo(0,0);}
  else if(act==='alarm-test'){fireAlarm(today(),true);}
  else if(act==='code-copy'){
    var ta=$('f-code');if(!ta)return;
    ta.value=makeCode();ta.focus();ta.select();
    var copied=false;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){toast('コピーしました');},function(){toast('文字を えらびました。コピーしてください');});
        copied=true;
      }
    }catch(e){}
    if(!copied)toast('文字を えらびました。コピーしてください');
  }
  else if(act==='code-import'){
    var ti=$('f-import'),val=ti?ti.value.trim():'';
    if(!val){toast('コードを 貼りつけてください');return;}
    if(applyCode(val)){recompute(today());save();render();toast('設定を よみこみました');}
    else toast('コードが ただしくありません');
  }
  else if(act==='add'){
    var nb=el.getAttribute('data-b'),nid='t'+(++S.seq);
    S.tasks[nb].push({id:nid,label:'あたらしい やること'});save();render();
    var inp=$('lbl-'+nid);if(inp){inp.focus();inp.select();}
  }else if(act==='del'){
    if(S.timer&&S.timer.id===id)stopTimer();
    var db=blockOf(id);
    if(db){S.tasks[db]=S.tasks[db].filter(function(x){return x.id!==id;});}
    recompute(today());save();render();
  }else if(act==='reset-today'){
    if(ui.confirm==='today'){var k=keyOf(new Date());S.days[k]={done:{},pts:0,full:false};ui.confirm=null;save();toast('きょうのチェックを けしました');}
    else ui.confirm='today';
    render();
  }else if(act==='reset-all'){
    if(ui.confirm==='all'){S.days={};S.spent=0;ui.confirm=null;stopTimer();save();toast('ぜんぶ けしました');}
    else ui.confirm='all';
    render();
  }
});
document.addEventListener('change',function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute('data-f');
  if(!f)return;
  var v=el.value,t;
  if(f==='label'){
    t=taskById(el.getAttribute('data-id'));if(!t)return;
    if(v.trim())t.label=v.trim();else el.value=t.label;
  }else if(f==='min'){
    t=taskById(el.getAttribute('data-id'));if(!t)return;
    var m=parseInt(v,10);
    if(m>0)t.min=Math.min(m,180);else{delete t.min;el.value='';}
  }else if(f==='confirm'){
    t=taskById(el.getAttribute('data-id'));if(!t)return;
    if(el.checked)t.confirm=true;else delete t.confirm;
  }else if(f==='late'){
    t=taskById(el.getAttribute('data-id'));if(!t)return;
    if(el.checked)t.late=true;else delete t.late;
  }else if(f==='items'){
    t=taskById(el.getAttribute('data-id'));if(!t)return;
    var list=v.split(/[、,，\n]/).map(function(x){return x.trim();}).filter(function(x){return x;});
    if(list.length){t.items=list;}
    el.value=t.items.join('、');
    var d0=today();syncItems(d0,t);recompute(d0);
  }else if(f==='rewardMin'){
    S.settings.rewardMin=Math.min(240,Math.max(1,parseInt(v,10)||60));el.value=S.settings.rewardMin;
  }else if(f==='goalPts'){
    S.settings.goalPts=Math.min(999,Math.max(1,parseInt(v,10)||180));el.value=S.settings.goalPts;
  }else if(f==='goalLabel'){
    S.settings.goalLabel=v.trim()||'ごほうびをえらべる';el.value=S.settings.goalLabel;
  }else if(f==='alarm'){
    S.settings.alarm=v||'';
  }
  save();renderTop();
  var ct=$('f-code');if(ct)ct.value=makeCode();
});

recompute(today());
save();
render();
